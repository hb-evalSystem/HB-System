# .github/workflows/tests.yml
# ================================
# Replaces the original ci.yml with an enhanced version that adds:
#   - Multi-Python matrix (3.8 through 3.12)
#   - Coverage reporting
#   - Reproducibility smoke test
#   - SDK import verification
#
# Badge URL for README.md:
# https://github.com/hb-evalSystem/HB-System/actions/workflows/tests.yml/badge.svg

name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Core unit tests — run on every Python version we support ─────────────
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what the tests actually need. requirements.txt also lists the
          # Streamlit dashboard stack, which no test imports - installing it
          # here would add minutes to every run and give the build more ways to
          # fail for reasons unrelated to the code being tested.
          pip install "requests>=2.28.0"

      - name: Run unit tests
        run: python tests/test_suite.py

      - name: Verify all paper claims (offline, < 5 seconds)
        run: python examples/replicate_paper_results.py --verify

      - name: Run quick start example
        run: python examples/quick_start.py

      - name: Convergence analysis — demo mode
        run: python analysis/convergence_analysis.py --demo --out /tmp/convergence_test.json

  # ── Statistical reproducibility from sample data ─────────────────────────
  reproducibility-check:
    name: Reproducibility Check
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.28.0"

      - name: Verify sample records are present and readable
        run: |
          python -c "
          import json, os
          sample_dir = 'data/sample_records/'
          files = [f for f in os.listdir(sample_dir) if f.endswith('.json')]
          assert len(files) > 0, 'No sample records found'
          for f in files:
              with open(os.path.join(sample_dir, f)) as fh:
                  data = json.load(fh)
              print(f'  OK: {f}')
          print(f'Sample records verified: {len(files)} files')
          "

      - name: Verify the published dataset matches its manifest
        run: python tests/verify_dataset.py

  # ── Single required check for branch protection rules ────────────────────
  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [unit-tests, reproducibility-check]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit tests failed."
            exit 1
          fi
          echo "All checks passed."
